<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bertahanlah sejenak</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background halus agar tidak flat */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(15,23,42,0) 70%);
            z-index: -1;
        }

        .container {
            width: 85%;
            max-width: 400px;
            text-align: center;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .icon-heart {
            font-size: 40px;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .btn-talk {
            display: block;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-talk:active {
            background: var(--accent);
            color: var(--bg-color);
        }

        .breathe-guide {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="glow"></div>

<div class="container">
    <div class="icon-heart">💙</div>
    <h1>Menepi Sejenak...</h1>
    <p id="quote">"Kamu tidak harus memecahkan semuanya hari ini. Cukup bertahan untuk satu jam ke depan, itu sudah lebih dari cukup."</p>
    
    <button class="btn-talk" onclick="changeQuote()">Butuh kata lain?</button>
    
    <div class="breathe-guide">Tarik napas... Hembuskan...</div>
</div>

<script>
    const quotes = [
        "Tidak apa-apa jika hari ini kamu hanya bisa bernapas. Itu sudah sebuah kemenangan.",
        "Dunia tidak akan kiamat jika kamu beristirahat sejenak dari bebanmu.",
        "Kamu berharga, bukan karena apa yang kamu lakukan, tapi karena kamu adalah kamu.",
        "Rasa sakit ini nyata, tapi ia tidak akan tinggal selamanya. Bertahanlah.",
        "Ada bagian dari dirimu yang jauh lebih kuat dari masalah yang sedang kamu hadapi."
    ];

    function changeQuote() {
        const textElement = document.getElementById('quote');
        const randomIndex = Math.floor(Math.random() * quotes.length);
        
        // Efek transisi sederhana
        textElement.style.opacity = 0;
        setTimeout(() => {
            textElement.innerText = `"${quotes[randomIndex]}"`;
            textElement.style.opacity = 1;
        }, 300);
    }
</script>

</body>
</html>
